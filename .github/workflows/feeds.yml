name: feeds

# Feeds rot quietly. This reports dead ones so the bot's view of the world does
# not narrow without anyone noticing.
on:
  schedule:
    - cron: '41 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/check_feeds.py
