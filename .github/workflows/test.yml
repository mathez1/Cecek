name: test

# Every push, on every branch. The tests need no secrets and the repo is
# public, so Actions minutes are unmetered: there is no reason to wait for a
# pull request to find out the bot no longer imports. `pull_request` is left
# off deliberately, because with an unfiltered `push` it would run everything
# twice on any branch that has one open.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Catches an unparseable feeds.txt or a syntax error in the bot before
      # the hourly job finds it at 03:23 on a Sunday.
      - name: Check the bot loads and the feed list parses
        run: |
          python -c "
          import bot.main, bot.brain, bot.x_client, bot.explore
          from bot.config import FEEDS_PATH
          sources = bot.explore.load_sources(FEEDS_PATH)
          assert sources, 'prompts/feeds.txt parsed to zero feeds'
          print(f'{len(sources)} feeds parsed OK')
          "
